services:
  postgres:
    image: postgres:16
    container_name: ez-market-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ez_market
    ports:
      - "5432:5432"
    volumes:
      - ez_market_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ez-market-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ez_market_redisdata:/data

volumes:
  ez_market_pgdata:
  ez_market_redisdata:
